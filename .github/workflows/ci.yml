name: Kimi K3 Enterprise Serving CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Dual-Engine Manifest Rendering & Kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        engine: [sglang, trtllm]
    steps:
      - uses: actions/checkout@v7
      - name: Install Kubeconform & gettext
        run: |
          sudo apt-get update && sudo apt-get install -y gettext-base curl
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render Workload Manifests
        env:
          INFERENCE_ENGINE: ${{ matrix.engine }}
        run: |
          cp scripts/config.env.example scripts/config.env
          sed -i 's|export PROJECT_ID="YOUR_PROJECT_ID"|export PROJECT_ID="ci-test"|' scripts/config.env
          ./scripts/03_deploy_workloads.sh --render-only
      - name: Assert no unintended unrendered variables
        run: bash tests/check_render_exceptions.sh
      - name: Validate with Kubeconform
        run: |
          kubeconform -strict -summary -schema-location default -schema-location 'terraform/manifests/schemas/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' -skip GKENetworkParamSet,Network terraform/manifests/generated/*.yaml

  secret-scan:
    name: Scan for Leaked Credentials and Paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run Secret Scan
        env:
          FORBIDDEN_PROJECT_ID: ${{ vars.FORBIDDEN_PROJECT_ID }}
        run: bash tests/check_secret_scan.sh

  dependency-floors:
    name: Dependency Floor Gate & Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.5.0"
      - name: Check Dependency Floors
        run: python3 tests/check_dependency_floors.py
      - name: Check Terraform Formatting & Validation
        run: |
          terraform fmt -check -recursive terraform/
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  telemetry-sanitizer:
    name: Telemetry Sanitizer Unit Tests & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile Python Scripts
        run: python3 -m py_compile benchmarks/*.py scripts/*.py tests/*.py tests/lib/*.py
      - name: Run Telemetry Sanitizer Unit Tests
        run: python3 -m unittest discover -s tests -p "test_*.py"

  serving-remediation:
    name: Serving Remediation Test Suite & ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck curl gettext-base
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh tests/lib/*.sh
      - name: Run Serving Remediation Test Suite
        run: bash tests/adv_test_serving_remediation.sh

  reproducibility:
    name: Benchmark Reproducibility & Integrity Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run Benchmark Integrity Audit
        run: python3 tests/adv_audit_benchmark_integrity.py
      - name: Check Benchmark Reproducibility & README Mutation Rejection
        run: |
          bash tests/adv_test_readme_mutation.sh
          if compgen -G "benchmarks/results/*/*.json" > /dev/null; then
            echo "--> Raw results present. Regenerating comparison table..."
            python3 benchmarks/generate_comparison.py
            git diff --exit-code README.md
          else
            echo "--> No raw results. Asserting README table carries no measurements..."
            BLOCK=$(sed -n '/ENGINE_COMPARISON_START/,/ENGINE_COMPARISON_END/p' README.md)
            if echo "$BLOCK" | grep -nE '[0-9]+(\.[0-9]+)?[[:space:]]*(ms|s|tok/s|tokens/s|GB|GiB|%)'; then
              echo "ERROR: README publishes measurements but benchmarks/results/ is empty."
              exit 1
            fi
            echo "    [OK] Placeholder table confirmed."
          fi

  e2e-coverage-suite:
    name: E2E Conformance & White-Box Coverage Hardening Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.5.0"
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck curl gettext-base
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Run Master E2E & Coverage Gaps Suites
        run: |
          bash tests/test_e2e_kimi_k3.sh
          bash tests/adv_test_coverage_gaps.sh
          git status --porcelain
