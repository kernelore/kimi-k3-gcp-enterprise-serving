name: Kimi K3 Enterprise Serving CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform Validation & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.5.0"
    - name: Check Terraform Formatting
      run: terraform fmt -check -recursive terraform/
    - name: Initialize Terraform (No Backend)
      run: terraform -chdir=terraform init -backend=false
    - name: Validate Terraform Configuration
      run: terraform -chdir=terraform validate

  shellcheck:
    name: ShellCheck Script Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Run ShellCheck
      run: |
        sudo apt-get update && sudo apt-get install -y shellcheck
        shellcheck scripts/*.sh

  python-syntax:
    name: Python Syntax & Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Compile Python Scripts
      run: |
        python3 -m py_compile benchmarks/*.py scripts/*.py

  manifests:
    name: Dual-Engine Manifest Rendering & Kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        engine: [sglang, trtllm]
    steps:
      - uses: actions/checkout@v7
      - name: Install Kubeconform & gettext
        run: |
          sudo apt-get update && sudo apt-get install -y gettext-base curl
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render Workload Manifests
        env:
          INFERENCE_ENGINE: ${{ matrix.engine }}
        run: |
          cp scripts/config.env.example scripts/config.env
          sed -i 's|export PROJECT_ID="YOUR_PROJECT_ID"|export PROJECT_ID="ci-test"|' scripts/config.env
          ./scripts/03_deploy_workloads.sh --render-only
      - name: Assert no unintended unrendered variables
        run: |
          grep -rhoE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' terraform/manifests/generated/ \
            | tr -d '${}' | sort -u > /tmp/survivors.txt
          diff -u terraform/manifests/.render-exceptions /tmp/survivors.txt
      - name: Validate with Kubeconform
        run: |
          kubeconform -strict -summary -schema-location default -schema-location 'terraform/manifests/schemas/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' -skip GKENetworkParamSet,Network terraform/manifests/generated/*.yaml

  reproducibility:
    name: Check Benchmark Reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check Benchmark Reproducibility
        run: |
          if compgen -G "benchmarks/results/*/*.json" > /dev/null; then
            echo "--> Raw results present. Regenerating comparison table..."
            python3 benchmarks/generate_comparison.py
            git diff --exit-code README.md
          else
            echo "--> No raw results. Asserting README table carries no measurements..."
            BLOCK=$(sed -n '/ENGINE_COMPARISON_START/,/ENGINE_COMPARISON_END/p' README.md)
            if echo "$BLOCK" | grep -nE '[0-9]+(\.[0-9]+)?[[:space:]]*(ms|s|tok/s|tokens/s|GB|GiB|%)'; then
              echo "ERROR: README publishes measurements but benchmarks/results/ is empty." >&2
              exit 1
            fi
            echo "Placeholder table contains no measurements. OK."
          fi
